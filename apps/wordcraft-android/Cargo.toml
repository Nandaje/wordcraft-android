[package]
name = "wordcraft-android"
description = "WordCraft on Android (wgpu Vulkan/GLES hardware acceleration, SAF + runtime storage permissions for document import/export)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "wordcraft_android"
crate-type = ["cdylib", "rlib"]

# Only the Android JNI/Activity entrypoint (`android_entry.rs`) uses `#[unsafe(no_mangle)]` and JNI
# pointers; every other module in this crate is 100% safe Rust.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-fonts = { workspace = true }
wordcraft-proof = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-ui-egui = { workspace = true }
wordcraft-control-key = { workspace = true }
eframe = { workspace = true, features = ["wgpu", "persistence"] }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["wgpu", "android-native-activity", "persistence"] }
android-activity = { version = "=0.6.1", default-features = false, features = ["native-activity"] }
jni = "=0.22.4"
ndk = { version = "=0.9.0", default-features = false }
