name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-apk:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK & NDK 27
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.0.12077973
        run: sdkmanager --install "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"

      - name: Run wordcraft-android unit tests on host
        run: cargo test -p wordcraft-android --lib

      - name: Build Android APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: bash packaging/android/package.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-arm64-v8a-apk
          path: dist/release/*.apk
